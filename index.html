```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Atlas Generator</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>

body{
background:#0d0d0d;
color:white;
font-family:system-ui;
margin:0;
padding:20px;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
}

h1{
font-size:22px;
margin-bottom:10px;
}

.upload{
border:2px dashed #555;
border-radius:12px;
padding:30px;
margin-top:20px;
}

input{
margin-top:10px;
}

button{
background:#1ea7ff;
border:none;
padding:12px 18px;
border-radius:8px;
color:white;
font-size:16px;
margin-top:15px;
}

canvas{
margin-top:20px;
max-width:100%;
border-radius:8px;
border:1px solid #333;
}

.progress{
height:10px;
background:#222;
border-radius:10px;
margin-top:15px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#1ea7ff;
}

#status{
margin-top:10px;
color:#aaa;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>Texture Atlas Generator</h1>

<div class="upload">
Upload Texture ZIP
<br>
<input type="file" id="zipInput" accept=".zip">
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="status">Waiting for ZIP...</div>

<canvas id="atlas"></canvas>

<button onclick="downloadAtlas()">Download Atlas</button>

</div>

<script>

const MAX_SIZE = 2048

let canvas=document.getElementById("atlas")
let ctx=canvas.getContext("2d")

canvas.width=MAX_SIZE
canvas.height=MAX_SIZE

let x=0
let y=0
let rowHeight=0

document.getElementById("zipInput").addEventListener("change",e=>{
processZip(e.target.files[0])
})

async function processZip(file){

const status=document.getElementById("status")
const bar=document.getElementById("bar")

status.innerText="Opening ZIP..."

const zip=await JSZip.loadAsync(file)

const files=[]

for(const name in zip.files){

if(name.match(/\.(png|jpg|jpeg|webp)$/i)){
files.push(zip.files[name])
}

}

status.innerText="Textures found: "+files.length

for(let i=0;i<files.length;i++){

const blob=await files[i].async("blob")

const img=await loadImage(blob)

placeTexture(img)

URL.revokeObjectURL(img.src)

bar.style.width=((i/files.length)*100)+"%"

status.innerText="Processing "+(i+1)+" / "+files.length

await sleep(5)

}

status.innerText="Atlas complete!"

}

function placeTexture(img){

if(x+img.width>MAX_SIZE){

x=0
y+=rowHeight
rowHeight=0

}

if(y+img.height>MAX_SIZE){
return
}

ctx.drawImage(img,x,y)

rowHeight=Math.max(rowHeight,img.height)

x+=img.width

}

function loadImage(blob){

return new Promise(resolve=>{
const img=new Image()
img.onload=()=>resolve(img)
img.src=URL.createObjectURL(blob)
})

}

function downloadAtlas(){

const link=document.createElement("a")

link.href=canvas.toDataURL("image/png")

link.download="texture_atlas.png"

link.click()

}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms))
}

</script>

</body>
</html>
