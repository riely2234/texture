<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Generator</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0a0a;
  --surface:#111;
  --border:#1e1e1e;
  --border-bright:#2a2a2a;
  --accent:#e8ff47;
  --accent2:#ff6b35;
  --text:#f0f0f0;
  --muted:#555;
  --muted2:#333;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  min-height:100vh;
  padding:0;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:720px;
  margin:0 auto;
  padding:40px 20px 60px;
}

header{
  display:flex;align-items:flex-end;gap:14px;
  margin-bottom:48px;border-bottom:1px solid var(--border-bright);padding-bottom:24px;
}

.logo-mark{
  width:44px;height:44px;background:var(--accent);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;padding:6px;flex-shrink:0;
}
.logo-mark span{background:var(--bg);display:block;}
.logo-mark span:last-child{background:var(--accent2);}

h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;}
h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:4px;}

.upload-zone{
  border:1px solid var(--border-bright);border-radius:4px;padding:40px 30px;
  background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.upload-zone::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,255,71,.03) 0%,transparent 60%);pointer-events:none;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:#131300;}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{width:48px;height:48px;border:1px solid var(--border-bright);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;transition:border-color .15s,color .15s;}
.upload-zone:hover .upload-icon,.upload-zone.drag .upload-icon{border-color:var(--accent);color:var(--accent);}
.upload-label{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;}
.upload-sub{font-size:11px;color:var(--muted);letter-spacing:1px;}

.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
select,input[type=number]{
  background:var(--surface);border:1px solid var(--border-bright);border-radius:4px;
  color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:10px 12px;
  appearance:none;-webkit-appearance:none;outline:none;transition:border-color .15s;width:100%;
}
select:focus,input[type=number]:focus{border-color:var(--accent);}
.select-wrap{position:relative;}
.select-wrap::after{content:'↓';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px;}

.progress-block{margin-top:24px;display:none;}
.progress-block.show{display:block;}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
#pct{font-size:13px;color:var(--accent);font-weight:500;}
.bar-track{height:3px;background:var(--muted2);border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;width:0%;background:var(--accent);transition:width .08s linear;border-radius:2px;}
#status{margin-top:10px;font-size:12px;color:var(--muted);min-height:18px;}

.stats{display:none;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-bright);border:1px solid var(--border-bright);border-radius:4px;overflow:hidden;margin-top:24px;}
.stats.show{display:grid;}
.stat{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:4px;}
.stat-value{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);line-height:1;}
.stat-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}

.preview-wrap{display:none;margin-top:24px;border:1px solid var(--border-bright);border-radius:4px;overflow:hidden;background:repeating-conic-gradient(#1a1a1a 0% 25%,#111 0% 50%) 0 0/16px 16px;}
.preview-wrap.show{display:block;}
.preview-header{background:var(--surface);border-bottom:1px solid var(--border-bright);padding:10px 14px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
#atlasCanvas{display:block;max-width:100%;width:100%;image-rendering:pixelated;}

#dlBtn{display:none;width:100%;margin-top:12px;background:var(--accent);color:#000;border:none;border-radius:4px;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:16px 24px;cursor:pointer;transition:background .15s,transform .1s;}
#dlBtn.show{display:block;}
#dlBtn:hover:not(:disabled){background:#d4eb30;transform:translateY(-1px);}
#dlBtn:active:not(:disabled){transform:translateY(0);}
#dlBtn:disabled{background:#888;cursor:wait;opacity:.8;}
#dlBtn:not(:disabled)::after{content:'↓';margin-left:8px;font-size:16px;}

#skippedBox{display:none;margin-top:12px;padding:12px 14px;background:#1a0800;border:1px solid #331500;border-radius:4px;font-size:11px;color:var(--accent2);letter-spacing:.5px;line-height:1.6;}
#skippedBox.show{display:block;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
    <h1><small>Tool / v3</small>Atlas Generator</h1>
  </header>

  <div class="upload-zone" id="dropZone">
    <input type="file" id="zipInput" accept=".zip">
    <div class="upload-icon">&#9723;</div>
    <div class="upload-label">Drop a ZIP of textures</div>
    <div class="upload-sub">PNG · JPG · WEBP supported</div>
  </div>

  <div class="settings">
    <div class="field">
      <label>Starting Size</label>
      <div class="select-wrap">
        <select id="atlasSize">
          <option value="512">512 (auto-grow)</option>
          <option value="1024" selected>1024 (auto-grow)</option>
          <option value="2048">2048 (auto-grow)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Padding (px)</label>
      <input type="number" id="padding" value="2" min="0" max="32">
    </div>
  </div>

  <div class="progress-block" id="progressBlock">
    <div class="progress-header">
      <span class="progress-label">Processing</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div id="status">Waiting…</div>
  </div>

  <div class="stats" id="statsRow">
    <div class="stat"><div class="stat-value" id="statPacked">—</div><div class="stat-label">Packed</div></div>
    <div class="stat"><div class="stat-value" id="statSkipped">—</div><div class="stat-label">Skipped</div></div>
    <div class="stat"><div class="stat-value" id="statFill">—</div><div class="stat-label">Fill %</div></div>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="preview-header">
      <span>Preview</span>
      <span id="previewDims">—</span>
    </div>
    <canvas id="atlasCanvas"></canvas>
  </div>

  <div id="skippedBox"></div>
  <button id="dlBtn" onclick="downloadAtlas()">Download Atlas PNG</button>

</div>
<script>
// ─── MaxRects bin packing (BSSF — Best Short Side Fit) ────────────────────────
class MaxRects {
  constructor(w, h) {
    this.W = w; this.H = h;
    this.free = [{ x:0, y:0, w, h }];
  }

  insert(rw, rh) {
    let best = null, bestScore = Infinity;
    for (const f of this.free) {
      if (rw <= f.w && rh <= f.h) {
        const score = Math.min(f.w - rw, f.h - rh);
        if (score < bestScore) { bestScore = score; best = f; }
      }
    }
    if (!best) return null;
    const placed = { x: best.x, y: best.y, w: rw, h: rh };
    this._split(placed);
    this._prune();
    return { x: placed.x, y: placed.y };
  }

  _split(p) {
    const next = [];
    for (const f of this.free) {
      if (!this._overlaps(p, f)) { next.push(f); continue; }
      if (p.x > f.x)               next.push({ x:f.x,       y:f.y, w:p.x-f.x,             h:f.h });
      if (p.x+p.w < f.x+f.w)       next.push({ x:p.x+p.w,   y:f.y, w:(f.x+f.w)-(p.x+p.w), h:f.h });
      if (p.y > f.y)               next.push({ x:f.x, y:f.y,       w:f.w, h:p.y-f.y             });
      if (p.y+p.h < f.y+f.h)       next.push({ x:f.x, y:p.y+p.h,   w:f.w, h:(f.y+f.h)-(p.y+p.h) });
    }
    this.free = next;
  }

  _prune() {
    this.free = this.free.filter((a,i) =>
      !this.free.some((b,j) => j!==i && b.x<=a.x && b.y<=a.y && b.x+b.w>=a.x+a.w && b.y+b.h>=a.y+a.h)
    );
  }

  _overlaps(a, b) {
    return !(a.x+a.w<=b.x || b.x+b.w<=a.x || a.y+a.h<=b.y || b.y+b.h<=a.y);
  }
}

// ─── UI ───────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('atlasCanvas');
const ctx    = canvas.getContext('2d');

function setStatus(t){ document.getElementById('status').textContent = t; }
function setPct(n){
  const p = Math.min(100, Math.round(n));
  document.getElementById('pct').textContent = p+'%';
  document.getElementById('barFill').style.width = p+'%';
}
function sleep(){ return new Promise(r => requestAnimationFrame(r)); }

function loadImage(blob){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(blob);
    img.onload  = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

const zone = document.getElementById('dropZone');
zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', ()=> zone.classList.remove('drag'));
zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) processZip(e.dataTransfer.files[0]); });
document.getElementById('zipInput').addEventListener('change', e=>{ if(e.target.files[0]) processZip(e.target.files[0]); });

// ─── Pure JS pack (no canvas, no pixel data) — returns placements or null ─────
function tryPack(items, size, pad) {
  const packer = new MaxRects(size, size);
  const placements = [];
  for (const m of items) {
    const pw = m.w + pad, ph = m.h + pad;
    if (pw > size || ph > size) return null;
    const pos = packer.insert(pw, ph);
    if (!pos) return null;
    placements.push({ ...m, x: pos.x, y: pos.y });
  }
  return placements;
}

// ─── Main ─────────────────────────────────────────────────────────────────────
async function processZip(file){
  const START   = parseInt(document.getElementById('atlasSize').value);
  const PAD     = Math.max(0, parseInt(document.getElementById('padding').value)||0);
  const MAX_SIZE = 16384;
  const BATCH   = 6; // images loaded at once — keep low to limit peak RAM

  document.getElementById('progressBlock').classList.add('show');
  document.getElementById('statsRow').classList.remove('show');
  document.getElementById('previewWrap').classList.remove('show');
  document.getElementById('dlBtn').classList.remove('show');
  document.getElementById('skippedBox').classList.remove('show');
  setPct(0); setStatus('Opening ZIP…');

  let zip;
  try { zip = await JSZip.loadAsync(file); }
  catch(e){ setStatus('⚠ Could not read ZIP.'); return; }

  const entries = Object.values(zip.files)
    .filter(f => !f.dir && /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name));

  if(!entries.length){ setStatus('No images found in ZIP.'); return; }
  setStatus(`Found ${entries.length} images — reading dimensions…`);

  // ── Phase 1: read dimensions only, store blobs (not Image objects) ──────────
  // This keeps memory bounded — blobs are compressed, Image objects are not.
  const meta = []; // { blob, name, w, h }
  for(let i=0; i<entries.length; i+=BATCH){
    const batch = entries.slice(i, i+BATCH);
    const results = await Promise.allSettled(batch.map(async e=>{
      const blob = await e.async('blob');
      const img  = await loadImage(blob); // load just to measure
      const w=img.width, h=img.height;
      img.src=''; // release decoded bitmap immediately
      return { blob, name:e.name, w, h };
    }));
    results.forEach(r=> r.status==='fulfilled' && meta.push(r.value));
    setPct((i/entries.length)*35);
    setStatus(`Reading ${Math.min(i+BATCH, entries.length)} / ${entries.length}…`);
    await sleep();
  }

  // ── Phase 2: sort + pack (pure math, no pixel data) ─────────────────────────
  meta.sort((a,b) => (b.w*b.h)-(a.w*a.h));

  const oversized = [];
  const packable  = meta.filter(m=>{
    if(m.w+PAD<=MAX_SIZE && m.h+PAD<=MAX_SIZE) return true;
    oversized.push(m.name); return false;
  });

  const minRequired = packable.reduce((mx,m)=>Math.max(mx,m.w+PAD,m.h+PAD),0);
  let size = Math.max(START, nextPow2(minRequired));

  setStatus('Finding optimal size…');
  let placements = null;
  while(size <= MAX_SIZE){
    setStatus(`Trying ${size}×${size}…`);
    setPct(35 + Math.min(Math.log2(size/START)/Math.log2(MAX_SIZE/START),1)*20);
    await sleep();
    placements = tryPack(packable, size, PAD);
    if(placements) break;
    size *= 2;
  }

  // Fallback: pack as many as fit at MAX_SIZE
  const skippedNames = [...oversized];
  if(!placements){
    size = MAX_SIZE;
    const pb = new MaxRects(size,size);
    placements = [];
    for(const m of packable){
      const pos = pb.insert(m.w+PAD, m.h+PAD);
      if(pos) placements.push({...m, x:pos.x, y:pos.y});
      else skippedNames.push(m.name);
    }
  }

  // ── Phase 3: draw one image at a time, free immediately after ───────────────
  canvas.width  = size;
  canvas.height = size;
  ctx.clearRect(0,0,size,size);

  for(let i=0; i<placements.length; i++){
    const p = placements[i];
    // Reload from blob (still in memory), draw, then let it go
    const img = await loadImage(p.blob);
    ctx.drawImage(img, p.x, p.y, p.w, p.h);
    img.src = ''; // release decoded bitmap
    p.blob  = null; // release blob reference

    setPct(55 + (i/placements.length)*43);
    if(i % BATCH === 0){
      setStatus(`Drawing ${i+1} / ${placements.length}…`);
      await sleep(); // yield every batch so browser can breathe
    }
  }

  setPct(100); setStatus('Complete.');

  const filled  = placements.reduce((s,p)=>s+p.w*p.h, 0);
  const fillPct = ((filled/(size*size))*100).toFixed(1);
  document.getElementById('statPacked').textContent  = placements.length;
  document.getElementById('statSkipped').textContent = skippedNames.length;
  document.getElementById('statFill').textContent    = fillPct+'%';
  document.getElementById('statsRow').classList.add('show');
  document.getElementById('previewDims').textContent = `${size} × ${size}`;
  document.getElementById('previewWrap').classList.add('show');
  document.getElementById('dlBtn').classList.add('show');

  if(skippedNames.length){
    const box = document.getElementById('skippedBox');
    const names = skippedNames.slice(0,8).map(n=>n.split('/').pop()).join(', ');
    box.innerHTML = `<b>⚠ ${skippedNames.length} image(s) skipped</b> — didn't fit even at ${MAX_SIZE}px.<br>
      <span style="opacity:.7">${names}${skippedNames.length>8?` + ${skippedNames.length-8} more…`:''}</span>`;
    box.classList.add('show');
  }
}

function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

// ─── Download — encode PNG in a Worker so the main thread never freezes ───────
async function downloadAtlas(){
  const btn = document.getElementById('dlBtn');
  btn.textContent = 'Encoding…';
  btn.disabled = true;

  const W = canvas.width, H = canvas.height;

  // Read pixel data in horizontal strips to avoid one giant allocation spike
  const STRIP = 256; // rows per strip
  const strips = [];
  for(let y=0; y<H; y+=STRIP){
    const h = Math.min(STRIP, H-y);
    strips.push(ctx.getImageData(0, y, W, h));
    await new Promise(r=>setTimeout(r,0)); // yield
  }

  // Reassemble into one flat Uint8Array
  const total = W * H * 4;
  const rgba  = new Uint8Array(total);
  let offset  = 0;
  for(const s of strips){
    rgba.set(s.data, offset);
    offset += s.data.length;
  }

  // Encode PNG in a Worker using a self-contained UPNG-style encoder
  const workerSrc = `
    // Minimal PNG encoder (deflate via CompressionStream if available, else uncompressed)
    self.onmessage = async function(e){
      const {rgba, W, H} = e.data;
      try {
        const png = await encodePNG(rgba, W, H);
        self.postMessage({ok:true, png}, [png.buffer]);
      } catch(err) {
        self.postMessage({ok:false, err:String(err)});
      }
    };

    async function encodePNG(rgba, W, H){
      // Filter each row with Sub filter (good for most textures)
      const rowLen = W*4;
      const filtered = new Uint8Array(H*(rowLen+1));
      for(let y=0;y<H;y++){
        const off = y*rowLen;
        const foff = y*(rowLen+1);
        filtered[foff] = 1; // Sub filter
        filtered[foff+1] = rgba[off]; // first pixel: same as None
        filtered[foff+2] = rgba[off+1];
        filtered[foff+3] = rgba[off+2];
        filtered[foff+4] = rgba[off+3];
        for(let x=1;x<W;x++){
          const i=off+x*4, fi=foff+1+x*4;
          filtered[fi]   = (rgba[i]   - rgba[i-4]) & 0xff;
          filtered[fi+1] = (rgba[i+1] - rgba[i+1-4]) & 0xff;
          filtered[fi+2] = (rgba[i+2] - rgba[i+2-4]) & 0xff;
          filtered[fi+3] = (rgba[i+3] - rgba[i+3-4]) & 0xff;
        }
      }

      // Compress with CompressionStream (deflate-raw) — supported in all modern browsers
      let compressed;
      if(typeof CompressionStream !== 'undefined'){
        const cs = new CompressionStream('deflate-raw');
        const writer = cs.writable.getWriter();
        writer.write(filtered);
        writer.close();
        const chunks=[];
        const reader = cs.readable.getReader();
        while(true){
          const {done,value}=await reader.read();
          if(done) break;
          chunks.push(value);
        }
        let len=0; chunks.forEach(c=>len+=c.length);
        compressed=new Uint8Array(len);
        let pos=0; chunks.forEach(c=>{compressed.set(c,pos);pos+=c.length;});
      } else {
        // Fallback: zlib store (no compression, always works)
        compressed = storeZlib(filtered);
      }

      return buildPNG(W, H, compressed);
    }

    function storeZlib(data){
      // Non-compressed zlib block(s)
      const BSIZE = 65535;
      const blocks = Math.ceil(data.length/BSIZE)||1;
      const out = new Uint8Array(2 + data.length + blocks*5 + 4);
      out[0]=0x78; out[1]=0x01; // zlib header, no compression
      let pos=2, src=0;
      for(let b=0;b<blocks;b++){
        const chunk=Math.min(BSIZE, data.length-src);
        const last=b===blocks-1?1:0;
        out[pos++]=last;
        out[pos++]=chunk&0xff; out[pos++]=(chunk>>8)&0xff;
        out[pos++]=(~chunk)&0xff; out[pos++]=((~chunk)>>8)&0xff;
        out.set(data.subarray(src,src+chunk),pos);
        pos+=chunk; src+=chunk;
      }
      const a=adler32(data);
      out[pos]=(a>>24)&0xff;out[pos+1]=(a>>16)&0xff;out[pos+2]=(a>>8)&0xff;out[pos+3]=a&0xff;
      return out;
    }

    function adler32(d){
      let a=1,b=0;
      for(let i=0;i<d.length;i++){a=(a+d[i])%65521;b=(b+a)%65521;}
      return (b<<16)|a;
    }

    function buildPNG(W,H,idat){
      const sig=[137,80,78,71,13,10,26,10];
      const crc32tab=makeCRC();
      function crc(d){
        let c=0xffffffff;
        for(const b of d) c=crc32tab[(c^b)&0xff]^(c>>>8);
        return (c^0xffffffff)>>>0;
      }
      function makeCRC(){
        const t=new Uint32Array(256);
        for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c;}
        return t;
      }
      function chunk(type,data){
        const t=new TextEncoder().encode(type);
        const len=new Uint8Array(4);
        new DataView(len.buffer).setUint32(0,data.length);
        const crcData=new Uint8Array(4+data.length);
        crcData.set(t); crcData.set(data,4);
        const c=new Uint8Array(4);
        new DataView(c.buffer).setUint32(0,crc(crcData));
        return [...len,...crcData,...c];
      }

      const ihdr=new Uint8Array(13);
      const dv=new DataView(ihdr.buffer);
      dv.setUint32(0,W); dv.setUint32(4,H);
      ihdr[8]=8; ihdr[9]=6; ihdr[10]=0; ihdr[11]=0; ihdr[12]=0; // 8-bit RGBA

      const bytes=[
        ...sig,
        ...chunk('IHDR',ihdr),
        ...chunk('IDAT',idat),
        ...chunk('IEND',new Uint8Array(0))
      ];
      return new Uint8Array(bytes);
    }
  `;

  const blob   = new Blob([workerSrc], {type:'application/javascript'});
  const wurl   = URL.createObjectURL(blob);
  const worker = new Worker(wurl);

  worker.onmessage = function(e){
    worker.terminate();
    URL.revokeObjectURL(wurl);
    btn.textContent = 'Download Atlas PNG';
    btn.disabled = false;
    btn.style.setProperty('--after', "'↓'");

    if(!e.data.ok){ alert('PNG encoding failed: '+e.data.err); return; }

    const pngBlob = new Blob([e.data.png], {type:'image/png'});
    const dl = URL.createObjectURL(pngBlob);
    const a  = document.createElement('a');
    a.href=dl; a.download='texture_atlas.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(dl), 5000);
  };

  worker.onerror = function(err){
    worker.terminate();
    URL.revokeObjectURL(wurl);
    btn.textContent = 'Download Atlas PNG';
    btn.disabled = false;
    alert('Worker error: '+err.message);
  };

  worker.postMessage({rgba, W, H}, [rgba.buffer]);
}
</script>
